<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>African Foodies - Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===================== HEADER / NAV ===================== -->
<header class="site-header">
  <div class="logo">
    <img src="images/astros_african_foodies_logo.svg" alt="Astro's African Foodies logo">
  </div>
  <nav class="main-nav">
    <a href="homepage.html">Homepage</a>
    <a href="aboutus.html">About Us</a>
    <a href="munchies.html">Munchies</a>
    <a href="service.html">Services</a>
    <a href="contact.html" class="current">Contact</a>
    <a href="login.html" class="login-link">Login</a>
  </nav>
</header>

<hr class="divider">

<!-- ===================== CONTACT FORM ===================== -->
<div class="form-wrapper">
  <div class="form-card">
    <h1>Get in Touch</h1>
    <p class="subtitle">Questions, bulk orders or catering? Send us a message.</p>

    <form action="#" method="post">
      <div class="form-row">
        <label for="fullname">Name</label>
        <input type="text" id="fullname" name="fullname">
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="text" id="email" name="email">
      </div>
      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea>
      </div>
      <button type="submit" class="cta-button">Send Message</button>
    </form>
  </div>
</div>

<footer class="page-footer">
  <p><i><a href="homepage.html">&laquo; Back to Homepage</a></i></p>
</footer>

<script src="script.js" defer></script>
</body>
</html>
