<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>African Foodies - Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===================== HEADER / NAV ===================== -->
<header class="site-header">
  <div class="logo">
    <img src="images/astros_african_foodies_logo.svg" alt="Astro's African Foodies logo">
  </div>
  <nav class="main-nav">
    <a href="homepage.html">Homepage</a>
    <a href="aboutus.html">About Us</a>
    <a href="munchies.html">Munchies</a>
    <a href="service.html">Services</a>
    <a href="contact.html">Contact</a>
    <a href="login.html" class="login-link">Login</a>
  </nav>
</header>

<hr class="divider">

<!-- ===================== SIGN UP FORM ===================== -->
<div class="form-wrapper">
  <div class="form-card">
    <h1>Join African Foodies</h1>
    <p class="subtitle">Create an account to start ordering.</p>

    <form action="#" method="post">
      <div class="form-row">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname">
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="text" id="email" name="email">
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
      </div>
      <div class="form-row">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password">
      </div>
      <button type="submit" class="cta-button">Sign Up</button>
    </form>

    <p class="form-footer">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<footer class="page-footer">
  <p><i><a href="homepage.html">&laquo; Back to Homepage</a></i></p>
</footer>

<script src="script.js" defer></script>
</body>
</html>
