<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3a2b"/>
      <stop offset="100%" stop-color="#0d2318"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#c98f1e"/>
    </linearGradient>
    <path id="textCircleTop" d="M 90,300 A 210,210 0 0 1 510,300"/>
    <path id="textCircleBottom" d="M 150,455 A 190,190 0 0 0 450,455"/>
  </defs>

  <!-- Outer ring -->
  <circle cx="300" cy="300" r="290" fill="url(#goldGrad)"/>
  <circle cx="300" cy="300" r="270" fill="url(#bgGrad)" stroke="#f2c14e" stroke-width="4"/>
  <circle cx="300" cy="300" r="250" fill="none" stroke="#f2c14e" stroke-width="2" opacity="0.5"/>

  <!-- Curved heading text -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#f2c14e" letter-spacing="4">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">ASTROS</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#f7e3a1" letter-spacing="3">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">AFRICAN FOODIES</textPath>
  </text>

  <!-- Decorative divider dots between headings -->
  <circle cx="115" cy="180" r="4" fill="#f2c14e"/>
  <circle cx="485" cy="180" r="4" fill="#f2c14e"/>

  <!-- ============ 3 FOOD ICONS ARRANGED IN A TRIANGLE ============ -->

  <!-- ICON 1: Bowl of Pap & Chakalaka (top-left-ish, at 210deg) -->
  <g transform="translate(195,330)">
    <ellipse cx="0" cy="35" rx="70" ry="18" fill="#000" opacity="0.25"/>
    <path d="M -65,0 A 65,45 0 0 0 65,0 L 60,15 A 60,38 0 0 1 -60,15 Z" fill="#8a5a2b"/>
    <ellipse cx="0" cy="0" rx="65" ry="22" fill="#a9703c"/>
    <ellipse cx="-15" cy="-3" rx="42" ry="14" fill="#f5eddd"/>
    <ellipse cx="25" cy="4" rx="24" ry="10" fill="#d9622b"/>
    <circle cx="18" cy="0" r="3" fill="#7a2e14"/>
    <circle cx="30" cy="6" r="3" fill="#7a2e14"/>
    <circle cx="22" cy="9" r="2.5" fill="#3f7d32"/>
  </g>

  <!-- ICON 2: Sosatie / Braai Skewer (top-right-ish, at 330deg) -->
  <g transform="translate(405,330) rotate(-18)">
    <rect x="-75" y="-6" width="150" height="12" rx="6" fill="#c98f1e"/>
    <circle cx="-50" cy="0" r="16" fill="#a0432a"/>
    <circle cx="-20" cy="0" r="16" fill="#d9622b"/>
    <circle cx="10" cy="0" r="16" fill="#3f7d32"/>
    <circle cx="40" cy="0" r="16" fill="#a0432a"/>
    <circle cx="65" cy="0" r="14" fill="#e8a33d"/>
    <circle cx="-50" cy="0" r="16" fill="none" stroke="#5c1f10" stroke-width="1.5" opacity="0.5"/>
    <circle cx="-20" cy="0" r="16" fill="none" stroke="#5c1f10" stroke-width="1.5" opacity="0.5"/>
    <circle cx="10" cy="0" r="16" fill="none" stroke="#1e4a19" stroke-width="1.5" opacity="0.5"/>
    <circle cx="40" cy="0" r="16" fill="none" stroke="#5c1f10" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- ICON 3: Bunny Chow (bottom center, at 90deg) -->
  <g transform="translate(300,415)">
    <path d="M -70,10 Q -75,-45 0,-50 Q 75,-45 70,10 Q 70,25 0,28 Q -70,25 -70,10 Z" fill="#e8b45a"/>
    <path d="M -60,8 Q -63,-30 0,-34 Q 63,-30 60,8 Q 60,16 0,18 Q -60,16 -60,8 Z" fill="#c98f1e"/>
    <path d="M -40,0 Q -42,-16 0,-18 Q 42,-16 40,0 Q 40,10 0,12 Q -40,10 -40,0 Z" fill="#d9622b"/>
    <circle cx="-15" cy="-3" r="3" fill="#7a2e14"/>
    <circle cx="8" cy="2" r="3" fill="#7a2e14"/>
    <circle cx="-2" cy="6" r="2.5" fill="#3f7d32"/>
    <circle cx="20" cy="-2" r="2.5" fill="#3f7d32"/>
  </g>

  <!-- subtle African pattern accents -->
  <g opacity="0.35" stroke="#f2c14e" stroke-width="2" fill="none">
    <path d="M 250,140 l 10,10 -10,10 -10,-10 Z"/>
    <path d="M 350,140 l 10,10 -10,10 -10,-10 Z"/>
    <path d="M 300,120 l 10,10 -10,10 -10,-10 Z"/>
  </g>
</svg>
